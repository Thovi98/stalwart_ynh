#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "stalwart"
name = "Stalwart"
description.en = " All-in-one Mail & Collaboration server. Secure, scalable and fluent in every protocol (IMAP, JMAP, SMTP, CalDAV, CardDAV, WebDAV). "

version = "0.16.0~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "AGPL-3.0"
website = "https://stalw.art/"
admindoc = "https://stalw.art/docs/category/getting-started"
code = "https://github.com/stalwartlabs/stalwart"

cpe = "cpe:2.3:a:stalw:stalwart"
fund = "https://opencollective.com/stalwart"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true

ldap = true
sso = true

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["fr", "en"]
    default = "fr"

    [install.admin]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    type = "user"

    [install.password]
    # this is a generic question - ask strings are automatically handled by YunoHost's core
    # Note that user-provided passwords questions are not automatically saved as setting
    help.en = "Use the help field to add an information for the admin about this question."
    help.fr = "Utilisez le champ aide pour ajouter une information à l'intention de l'administrateur à propos de cette question."
    type = "password"

[resources]
    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/stalwartlabs/stalwart/releases/download/v0.16.0/stalwart-x86_64-unknown-linux-gnu.tar.gz"
    amd64.sha256 = "1be63ae7897ff8235ad7c9a6dd361f136c68f0665bda9a1e561ab0a690503b76"
    arm64.url = "https://github.com/stalwartlabs/stalwart/releases/download/v0.16.0/stalwart-aarch64-unknown-linux-gnu.tar.gz"
    arm64.sha256 = "15e946a17688e125e164cf0bd13d85a0fcf540c64142f8ab8226f034b98c5689"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*x86_64-*\\.tar.gz$"
    autoupdate.asset.arm64 = ".*aarch64-*\\.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    # This will pick a random port for reverse-proxying and store it as the $port setting

    [resources.apt]
    packages = "mariadb-server, deb1, deb2, php8.3-foo, php8.3-bar"

    [resources.database]
    type = "postgresql"
